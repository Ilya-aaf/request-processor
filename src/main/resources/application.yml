server:
  port: ${ITM_PLATFORM_REQUEST_PROCESSOR_PORT:8081}
  servlet:
    context-path: /${spring.application.name}

db-schema: notification_outbox

logging:
  level:
    com.itm.space.notificationservice: INFO

spring:
  application:
    name: request-processor

  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:${ITM_PLATFORM_DATABASE_URL:postgresql://localhost:5432/postgres}?currentSchema=${db-schema}&ApplicationName=${spring.application.name}
    username: ${ITM_PLATFORM_DATABASE_USERNAME:postgres}
    password: ${ITM_PLATFORM_DATABASE_PASSWORD:postgres}

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        show_sql: false
        open-in-view: false

  kafka:
    bootstrap-servers: ${ITM_PLATFORM_KAFKA_HOST:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: 1

outbox:
  batch-size: 50
  delay-ms: 1000

